<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>食鹽水表面張力測定裝置 - 3D 互動檢視器</title>
  <style>
    :root {
      --bg-studio: radial-gradient(circle at 50% 40%, #f1f5f9 0%, #cbd5e1 100%);
      --text-main: #0f172a;
      --text-muted: #475569;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --pill-bg: rgba(255, 255, 255, 0.92);
      --pill-border: rgba(148, 163, 184, 0.5);
      --pill-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.12), 0 2px 6px -1px rgba(0, 0, 0, 0.06);
    }

    body.dark-mode {
      --bg-studio: radial-gradient(circle at 50% 40%, #1e293b 0%, #090d16 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #7dd3fc;
      --pill-bg: rgba(30, 41, 59, 0.9);
      --pill-border: rgba(71, 85, 105, 0.7);
      --pill-shadow: 0 4px 24px -2px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg-studio);
      color: var(--text-main);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      transition: background 0.3s ease;
    }

    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
      outline: none;
    }

    /* Minimal Top-Left Title */
    .top-brand {
      position: absolute;
      top: 20px;
      left: 24px;
      z-index: 10;
      pointer-events: none;
      background: var(--pill-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid var(--pill-border);
      box-shadow: var(--pill-shadow);
      transition: all 0.3s ease;
    }

    .top-brand h1 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-brand h1 span {
      font-size: 0.72rem;
      font-weight: 600;
      background: #e0f2fe;
      color: #0369a1;
      border: 1px solid #bae6fd;
      padding: 2px 7px;
      border-radius: 9999px;
    }

    body.dark-mode .top-brand h1 span {
      background: #0369a1;
      color: #e0f2fe;
      border-color: #0284c7;
    }

    .top-brand p {
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* Floating Clean Toolbar */
    .toolbar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: var(--pill-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--pill-border);
      border-radius: 40px;
      box-shadow: var(--pill-shadow);
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .tool-btn {
      cursor: pointer;
      font-family: inherit;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-main);
      padding: 7px 14px;
      border-radius: 24px;
      font-size: 0.82rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.18s ease;
      white-space: nowrap;
    }

    .tool-btn:hover {
      background: rgba(148, 163, 184, 0.2);
      color: var(--accent);
    }

    .tool-btn.active {
      background: #e0f2fe;
      border-color: #7dd3fc;
      color: #0369a1;
      font-weight: 600;
    }

    body.dark-mode .tool-btn.active {
      background: #0369a1;
      border-color: #38bdf8;
      color: #ffffff;
    }

    .tool-btn.primary {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.35);
    }

    .tool-btn.primary:hover {
      background: #0369a1;
    }

    .divider {
      width: 1px;
      height: 18px;
      background: var(--pill-border);
      margin: 0 2px;
    }

    @media (max-width: 640px) {
      .top-brand {
        top: 14px;
        left: 16px;
        padding: 8px 12px;
      }
      .top-brand h1 {
        font-size: 0.95rem;
      }
      .top-brand p {
        display: none;
      }
      .toolbar {
        bottom: 16px;
        padding: 5px 8px;
        gap: 4px;
        width: calc(100vw - 32px);
        justify-content: space-around;
      }
      .tool-btn {
        padding: 6px 10px;
        font-size: 0.76rem;
      }
    }
  </style>

  <!-- Load Three.js and dependencies (with automatic CDN fallback) -->
  <script src="libs/three.min.js"></script>
  <script>
    if (typeof THREE === 'undefined') {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');
    }
  </script>
  <script src="libs/OrbitControls.js"></script>
  <script>
    if (typeof THREE.OrbitControls === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"><\/script>');
    }
  </script>
  <script src="libs/GLTFExporter.js"></script>
  <script>
    if (typeof THREE.GLTFExporter === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"><\/script>');
    }
  </script>
</head>
<body>

  <!-- Top-Left Branding -->
  <div class="top-brand">
    <h1>
      食鹽水表面張力測定裝置
      <span>3D 模型</span>
    </h1>
    <p>左鍵旋轉 • 滾輪縮放 • 右鍵平移</p>
  </div>

  <!-- 3D Canvas -->
  <canvas id="webgl-canvas"></canvas>

  <!-- Minimal Floating Toolbar -->
  <div class="toolbar">
    <button class="tool-btn" id="btn-theme" onclick="toggleTheme()" title="切換 明亮工作室 / 深色實驗桌 背景">
      🌙 深色模式
    </button>
    <div class="divider"></div>
    <button class="tool-btn" id="btn-reset" onclick="resetView()" title="重置為最佳觀看角度">
      🔄 重置視角
    </button>
    <button class="tool-btn" id="btn-rotate" onclick="toggleAutoRotate()" title="切換鏡頭慢速環繞">
      ⏯️ 自動旋轉
    </button>
    <div class="divider"></div>
    <button class="tool-btn primary" id="btn-export-glb" onclick="exportGLB()" title="導出 GLB 檔案（可插入 PowerPoint 簡報）">
      📥 導出 3D 模型 (.GLB)
    </button>
  </div>

  <script>
    /* =========================================================
       1. SCENE & STUDIO LIGHTING SETUP
       ========================================================= */
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    
    // Balanced studio colors: subtle cool gray so transparent objects have solid contrast
    let isDarkMode = false;
    const LIGHT_BG = new THREE.Color(0xdce4ec);
    const DARK_BG = new THREE.Color(0x0f172a);
    scene.background = LIGHT_BG;

    const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.5, 300);
    // Adjusted initial camera for complete overview of base and containers
    const DEFAULT_CAM_POS = new THREE.Vector3(26, 32, 54);
    const DEFAULT_LOOK_AT = new THREE.Vector3(0, 22, 0);
    camera.position.copy(DEFAULT_CAM_POS);

    const renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: true,
      alpha: true,
      preserveDrawingBuffer: true
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.copy(DEFAULT_LOOK_AT);
    controls.maxPolarAngle = Math.PI / 2 + 0.02; // Keep slightly above floor
    controls.minDistance = 12;
    controls.maxDistance = 110;
    controls.autoRotate = false;
    controls.autoRotateSpeed = 1.0;

    // Three-point balanced studio lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xffffff, 0.85);
    mainLight.position.set(28, 48, 38);
    mainLight.castShadow = true;
    mainLight.shadow.mapSize.width = 2048;
    mainLight.shadow.mapSize.height = 2048;
    mainLight.shadow.bias = -0.0004;
    mainLight.shadow.camera.near = 10;
    mainLight.shadow.camera.far = 120;
    mainLight.shadow.camera.left = -30;
    mainLight.shadow.camera.right = 30;
    mainLight.shadow.camera.top = 35;
    mainLight.shadow.camera.bottom = -10;
    scene.add(mainLight);

    const fillLight = new THREE.DirectionalLight(0xbfdbfe, 0.45);
    fillLight.position.set(-30, 35, -20);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xfffbeb, 0.35);
    rimLight.position.set(0, 25, 40);
    scene.add(rimLight);

    // Studio Contact Ground Plane (Receives Soft Shadows)
    const floorGeo = new THREE.PlaneGeometry(160, 160);
    const floorMat = new THREE.ShadowMaterial({ opacity: 0.18 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0.0;
    floor.receiveShadow = true;
    scene.add(floor);

    /* =========================================================
       2. PROCEDURAL TEXTURES (BEAKER GRADUATIONS)
       ========================================================= */
    function createBeakerScaleTexture() {
      const c = document.createElement('canvas');
      c.width = 1024;
      c.height = 1024;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, 1024, 1024);

      // We draw graduations on front-facing sector
      const startX = 380;
      const endX = 640;

      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 5;
      ctx.textAlign = 'left';
      ctx.font = 'bold 34px sans-serif';

      // Brand logo
      ctx.fillText('PYREX® 1000mL', startX + 10, 220);
      ctx.font = '26px sans-serif';
      ctx.fillText('BORO 3.3  APPROX.', startX + 10, 260);

      const marks = [
        { ml: '1000', y: 320, major: true },
        { ml: '900',  y: 385, major: false },
        { ml: '800',  y: 450, major: true },
        { ml: '700',  y: 515, major: false },
        { ml: '600',  y: 580, major: true },
        { ml: '500',  y: 645, major: false },
        { ml: '400',  y: 710, major: true },
        { ml: '300',  y: 775, major: false },
        { ml: '200',  y: 840, major: true }
      ];

      marks.forEach(m => {
        ctx.beginPath();
        const lineLen = m.major ? 85 : 45;
        ctx.lineWidth = m.major ? 6 : 3;
        ctx.moveTo(startX, m.y);
        ctx.lineTo(startX + lineLen, m.y);
        ctx.stroke();

        if (m.major) {
          ctx.font = 'bold 30px sans-serif';
          ctx.fillText(m.ml, startX + lineLen + 15, m.y + 10);
        }
      });

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.repeat.set(1, 1);
      return tex;
    }

    const beakerScaleTex = createBeakerScaleTexture();

    /* =========================================================
       3. CORE APPARATUS 3D MODEL
       ========================================================= */
    const apparatusRoot = new THREE.Group();
    scene.add(apparatusRoot);

    // Highly Visible & Calibrated PBR Materials
    const bluePaintMat = new THREE.MeshStandardMaterial({
      color: 0x1d4ed8,
      roughness: 0.35,
      metalness: 0.3
    });
    const chromeMat = new THREE.MeshStandardMaterial({
      color: 0xe2e8f0,
      roughness: 0.15,
      metalness: 0.92
    });
    const darkMetalMat = new THREE.MeshStandardMaterial({
      color: 0x334155,
      roughness: 0.45,
      metalness: 0.75
    });
    const woodMat = new THREE.MeshStandardMaterial({
      color: 0xd4a373,
      roughness: 0.6,
      metalness: 0.05
    });
    const stringMat = new THREE.MeshStandardMaterial({
      color: 0x334155,
      roughness: 0.8
    });

    // Frosted Translucent Polypropylene (Plastic Cup Body)
    const plasticCupMat = new THREE.MeshStandardMaterial({
      color: 0xf1f5f9,
      roughness: 0.28,
      metalness: 0.08,
      transparent: true,
      opacity: 0.68,
      depthWrite: false,
      side: THREE.DoubleSide
    });

    // High-visibility rim & ribs for cups (natural molded plastic highlight)
    const plasticFeatureMat = new THREE.MeshStandardMaterial({
      color: 0xe2e8f0,
      roughness: 0.25,
      metalness: 0.1,
      transparent: true,
      opacity: 0.78,
      side: THREE.DoubleSide
    });

    // Glass Beaker Material (Soft tinted ice blue with specular gleam)
    const glassMat = new THREE.MeshStandardMaterial({
      color: 0xdbeafe,
      roughness: 0.1,
      metalness: 0.12,
      transparent: true,
      opacity: 0.42,
      depthWrite: false,
      side: THREE.DoubleSide
    });

    const glassScaleMat = new THREE.MeshBasicMaterial({
      map: beakerScaleTex,
      transparent: true,
      opacity: 0.85,
      depthWrite: false,
      side: THREE.DoubleSide
    });

    const glassRimMat = new THREE.MeshStandardMaterial({
      color: 0xbfdbfe,
      roughness: 0.1,
      metalness: 0.2,
      transparent: true,
      opacity: 0.75
    });

    const acrylicMat = new THREE.MeshStandardMaterial({
      color: 0xe2e8f0,
      roughness: 0.2,
      metalness: 0.1,
      transparent: true,
      opacity: 0.6,
      depthWrite: false,
      side: THREE.DoubleSide
    });

    const cadEdgeMat = new THREE.LineBasicMaterial({
      color: 0x64748b,
      transparent: true,
      opacity: 0.7
    });

    const saltWaterMat = new THREE.MeshStandardMaterial({
      color: 0x38bdf8,
      roughness: 0.06,
      metalness: 0.15,
      transparent: true,
      opacity: 0.72
    });

    /* --- Retort Stand on RIGHT side (Consistent with 1018 Video) --- */
    const STAND_BASE_X = 12.0;
    const STAND_BASE_Z = -1.0;
    const POLE_X = 13.5;
    const POLE_Z = -5.5;
    const CLAMP_Y = 48.0;

    // Blue cast-iron base
    const standBaseGeo = new THREE.BoxGeometry(18, 2.0, 14);
    const standBase = new THREE.Mesh(standBaseGeo, bluePaintMat);
    standBase.position.set(STAND_BASE_X, 1.0, STAND_BASE_Z);
    standBase.castShadow = true;
    standBase.receiveShadow = true;
    apparatusRoot.add(standBase);

    const standBevelGeo = new THREE.BoxGeometry(17, 0.2, 13);
    const standBevel = new THREE.Mesh(standBevelGeo, bluePaintMat);
    standBevel.position.set(STAND_BASE_X, 2.1, STAND_BASE_Z);
    apparatusRoot.add(standBevel);

    // Vertical Steel Pole
    const poleGeo = new THREE.CylinderGeometry(0.65, 0.65, 54, 24);
    const pole = new THREE.Mesh(poleGeo, chromeMat);
    pole.position.set(POLE_X, 29.0, POLE_Z);
    pole.castShadow = true;
    apparatusRoot.add(pole);

    // Clamp
    const clampGeo = new THREE.BoxGeometry(3.0, 3.0, 3.0);
    const clamp = new THREE.Mesh(clampGeo, darkMetalMat);
    clamp.position.set(POLE_X, CLAMP_Y, POLE_Z);
    clamp.castShadow = true;
    apparatusRoot.add(clamp);

    const screwGeo = new THREE.CylinderGeometry(0.35, 0.35, 2.6, 12);
    const screw1 = new THREE.Mesh(screwGeo, chromeMat);
    screw1.rotation.z = Math.PI / 2;
    screw1.position.set(POLE_X + 1.8, CLAMP_Y, POLE_Z);
    apparatusRoot.add(screw1);

    const screw2 = new THREE.Mesh(screwGeo, chromeMat);
    screw2.rotation.x = Math.PI / 2;
    screw2.position.set(POLE_X, CLAMP_Y, POLE_Z - 1.8);
    apparatusRoot.add(screw2);

    // Connector forward from pole to horizontal crossbar
    const clampConnectGeo = new THREE.CylinderGeometry(0.55, 0.55, Math.abs(POLE_Z), 16);
    const clampConnect = new THREE.Mesh(clampConnectGeo, chromeMat);
    clampConnect.rotation.x = Math.PI / 2;
    clampConnect.position.set(POLE_X, CLAMP_Y, POLE_Z / 2);
    clampConnect.castShadow = true;
    apparatusRoot.add(clampConnect);

    // Horizontal Cross Rod extending from right across to left
    const horizArmGeo = new THREE.CylinderGeometry(0.6, 0.6, 20, 24);
    const horizArm = new THREE.Mesh(horizArmGeo, chromeMat);
    horizArm.rotation.z = Math.PI / 2;
    horizArm.position.set(6.0, CLAMP_Y, 0);
    horizArm.castShadow = true;
    apparatusRoot.add(horizArm);

    /* --- Center Pivot & Suspension System --- */
    const pivotStringGeo = new THREE.CylinderGeometry(0.07, 0.07, 13, 8);
    const pivotString = new THREE.Mesh(pivotStringGeo, stringMat);
    pivotString.position.set(0, 41.5, 0);
    apparatusRoot.add(pivotString);

    // Lever Pivot Group at (0, 35, 0)
    const pivotGroup = new THREE.Group();
    pivotGroup.position.set(0, 35, 0);
    apparatusRoot.add(pivotGroup);

    // Wooden Lever Beam: length 30cm (-15 to +15), height 0.6cm, width 1.8cm
    const leverGeo = new THREE.BoxGeometry(30, 0.6, 1.8);
    const leverBeam = new THREE.Mesh(leverGeo, woodMat);
    leverBeam.castShadow = true;
    pivotGroup.add(leverBeam);

    const centerTieGeo = new THREE.BoxGeometry(0.6, 0.8, 2.0);
    const centerTie = new THREE.Mesh(centerTieGeo, darkMetalMat);
    pivotGroup.add(centerTie);

    /* --- Left Hanging Inverted Cup --- */
    const LEFT_ARM_X = -13.5;
    const leftHangerGroup = new THREE.Group();
    leftHangerGroup.position.set(LEFT_ARM_X, 0, 0);
    pivotGroup.add(leftHangerGroup);

    const leftStringGeo = new THREE.CylinderGeometry(0.06, 0.06, 14, 8);
    const leftString = new THREE.Mesh(leftStringGeo, stringMat);
    leftString.position.set(0, -7.0, 0);
    leftHangerGroup.add(leftString);

    const invertedCupGroup = new THREE.Group();
    invertedCupGroup.position.set(0, -14.0, 0);
    leftHangerGroup.add(invertedCupGroup);

    const cupHeight = 9.0;
    // Cup tapered body
    const cupGeo = new THREE.CylinderGeometry(2.4, 3.4, cupHeight, 36, 1, true);
    const invertedCup = new THREE.Mesh(cupGeo, plasticCupMat);
    invertedCup.position.set(0, -cupHeight / 2, 0);
    invertedCup.castShadow = true;
    invertedCupGroup.add(invertedCup);

    // Cup top circular base
    const cupTopCapGeo = new THREE.CircleGeometry(2.4, 36);
    const cupTopCap = new THREE.Mesh(cupTopCapGeo, plasticFeatureMat);
    cupTopCap.rotation.x = -Math.PI / 2;
    invertedCupGroup.add(cupTopCap);

    // Cup bottom rolled rim
    const cupLipGeo = new THREE.TorusGeometry(3.42, 0.08, 12, 36);
    const cupLip = new THREE.Mesh(cupLipGeo, plasticFeatureMat);
    cupLip.rotation.x = Math.PI / 2;
    cupLip.position.set(0, -cupHeight, 0);
    invertedCupGroup.add(cupLip);

    // Cup reinforcing horizontal ribs (subtle, elegant ridges)
    [-2.2, -4.5, -6.8].forEach(ry => {
      const ribR = 2.4 + (-ry / cupHeight) * (3.4 - 2.4);
      const ribGeo = new THREE.TorusGeometry(ribR + 0.02, 0.04, 8, 36);
      const ribMesh = new THREE.Mesh(ribGeo, plasticFeatureMat);
      ribMesh.rotation.x = Math.PI / 2;
      ribMesh.position.set(0, ry, 0);
      invertedCupGroup.add(ribMesh);
    });

    /* --- Left Stationary 1000mL Glass Beaker & Salt Water --- */
    const beakerGroup = new THREE.Group();
    beakerGroup.position.set(LEFT_ARM_X, 0, 0);
    apparatusRoot.add(beakerGroup);

    const beakerHeight = 15.0;
    const beakerRadius = 5.4;
    
    // Main Glass Wall
    const beakerWallGeo = new THREE.CylinderGeometry(beakerRadius, beakerRadius, beakerHeight, 48, 1, true);
    const beakerWall = new THREE.Mesh(beakerWallGeo, glassMat);
    beakerWall.position.set(0, beakerHeight / 2, 0);
    beakerWall.castShadow = true;
    beakerGroup.add(beakerWall);

    // Beaker Measurement Scale Cylinder Overlay
    const beakerScaleGeo = new THREE.CylinderGeometry(beakerRadius + 0.02, beakerRadius + 0.02, beakerHeight, 48, 1, true);
    const beakerScaleMesh = new THREE.Mesh(beakerScaleGeo, glassScaleMat);
    beakerScaleMesh.position.set(0, beakerHeight / 2, 0);
    beakerScaleMesh.rotation.y = -Math.PI / 2.3;
    beakerGroup.add(beakerScaleMesh);

    // Thick Glass Bottom Base
    const beakerBottomGeo = new THREE.CylinderGeometry(beakerRadius, beakerRadius, 0.6, 48);
    const beakerBottom = new THREE.Mesh(beakerBottomGeo, glassRimMat);
    beakerBottom.position.set(0, 0.3, 0);
    beakerGroup.add(beakerBottom);

    // Beaker Top Flared Lip Rim
    const beakerRimGeo = new THREE.TorusGeometry(beakerRadius + 0.06, 0.16, 16, 48);
    const beakerRim = new THREE.Mesh(beakerRimGeo, glassRimMat);
    beakerRim.rotation.x = Math.PI / 2;
    beakerRim.position.set(0, beakerHeight, 0);
    beakerGroup.add(beakerRim);

    // Salt Water inside Beaker (up to 12.0cm, touching inverted cup)
    const liquidHeight = 12.0;
    const waterGeo = new THREE.CylinderGeometry(beakerRadius - 0.15, beakerRadius - 0.15, liquidHeight, 48);
    const waterMesh = new THREE.Mesh(waterGeo, saltWaterMat);
    waterMesh.position.set(0, liquidHeight / 2 + 0.3, 0);
    beakerGroup.add(waterMesh);

    // Adhesion Liquid Meniscus Ring
    const meniscusGeo = new THREE.CylinderGeometry(3.38, 3.42, 0.7, 36, 1, true);
    const meniscusMat = new THREE.MeshStandardMaterial({
      color: 0x7dd3fc,
      roughness: 0.08,
      metalness: 0.1,
      transparent: true,
      opacity: 0.85,
      side: THREE.DoubleSide
    });
    const meniscusMesh = new THREE.Mesh(meniscusGeo, meniscusMat);
    meniscusMesh.position.set(0, 12.0, 0);
    beakerGroup.add(meniscusMesh);

    /* --- Right Hanging Apparatus (Upright Cup + Colored Beads) --- */
    const RIGHT_ARM_X = 13.5;
    const rightHangerGroup = new THREE.Group();
    rightHangerGroup.position.set(RIGHT_ARM_X, 0, 0);
    pivotGroup.add(rightHangerGroup);

    // Two hanging strings tied to cup lip
    const rightString1Geo = new THREE.CylinderGeometry(0.06, 0.06, 17, 8);
    const rightString1 = new THREE.Mesh(rightString1Geo, stringMat);
    rightString1.position.set(0, -8.5, -1.8);
    rightString1.rotation.x = -0.12;
    rightHangerGroup.add(rightString1);

    const rightString2 = new THREE.Mesh(rightString1Geo, stringMat);
    rightString2.position.set(0, -8.5, 1.8);
    rightString2.rotation.x = 0.12;
    rightHangerGroup.add(rightString2);

    const weightCupGroup = new THREE.Group();
    weightCupGroup.position.set(0, -17.0, 0);
    rightHangerGroup.add(weightCupGroup);

    // Upright Plastic Cup Body
    const weightCup = new THREE.Mesh(cupGeo, plasticCupMat);
    weightCup.position.set(0, -cupHeight / 2, 0);
    weightCup.castShadow = true;
    weightCupGroup.add(weightCup);

    // Cup bottom disc (at y=-cupHeight)
    const weightCupBottom = new THREE.Mesh(cupTopCapGeo, plasticFeatureMat);
    weightCupBottom.rotation.x = Math.PI / 2;
    weightCupBottom.position.set(0, -cupHeight, 0);
    weightCupGroup.add(weightCupBottom);

    // Cup top rolled lip (at y=0)
    const weightCupLip = new THREE.Mesh(cupLipGeo, plasticFeatureMat);
    weightCupLip.rotation.x = Math.PI / 2;
    weightCupLip.position.set(0, 0, 0);
    weightCupGroup.add(weightCupLip);

    // Reinforcing ribs (subtle, elegant ridges)
    [-2.2, -4.5, -6.8].forEach(ry => {
      const ribR = 3.4 - (-ry / cupHeight) * (3.4 - 2.4);
      const ribGeo = new THREE.TorusGeometry(ribR + 0.02, 0.04, 8, 36);
      const ribMesh = new THREE.Mesh(ribGeo, plasticFeatureMat);
      ribMesh.rotation.x = Math.PI / 2;
      ribMesh.position.set(0, ry, 0);
      weightCupGroup.add(ribMesh);
    });

    // Colored Beads inside right cup (clearly resting on cup bottom)
    const beadsGroup = new THREE.Group();
    beadsGroup.position.set(0, -cupHeight + 0.35, 0);
    weightCupGroup.add(beadsGroup);

    const beadMaterials = [
      new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.25, metalness: 0.3 }),
      new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.25, metalness: 0.4 }),
      new THREE.MeshStandardMaterial({ color: 0x06b6d4, roughness: 0.25, metalness: 0.3 }),
      new THREE.MeshStandardMaterial({ color: 0x8b5cf6, roughness: 0.25, metalness: 0.3 }),
      new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, metalness: 0.1 }),
    ];

    const MAX_BEADS = 36;
    for (let b = 0; b < MAX_BEADS; b++) {
      const radius = 0.3;
      const beadGeo = new THREE.SphereGeometry(radius, 14, 14);
      const beadMat = beadMaterials[b % beadMaterials.length];
      const beadMesh = new THREE.Mesh(beadGeo, beadMat);
      
      const angle = (b * 137.5 * Math.PI) / 180;
      const r = Math.sqrt(b / MAX_BEADS) * 1.75;
      const bx = Math.cos(angle) * r;
      const bz = Math.sin(angle) * r;
      const by = Math.floor(b / 12) * 0.48;
      
      beadMesh.position.set(bx, by, bz);
      beadMesh.castShadow = true;
      beadsGroup.add(beadMesh);
    }

    // Transparent Square Catch Tray under right cup (sitting directly on blue stand)
    const trayGroup = new THREE.Group();
    trayGroup.position.set(RIGHT_ARM_X, 2.7, 0);
    apparatusRoot.add(trayGroup);

    const trayBaseGeo = new THREE.BoxGeometry(11, 0.4, 11);
    const trayBase = new THREE.Mesh(trayBaseGeo, acrylicMat);
    trayBase.position.set(0, 0.2, 0);
    trayGroup.add(trayBase);

    // Tray CAD edges for crisp readability
    const trayBaseEdges = new THREE.LineSegments(new THREE.EdgesGeometry(trayBaseGeo), cadEdgeMat);
    trayBaseEdges.position.set(0, 0.2, 0);
    trayGroup.add(trayBaseEdges);

    const wallH = 1.0;
    const wallThick = 0.3;
    const wallNGeo = new THREE.BoxGeometry(11, wallH, wallThick);
    const wallN = new THREE.Mesh(wallNGeo, acrylicMat);
    wallN.position.set(0, wallH / 2, 5.35);
    trayGroup.add(wallN);
    const wallNEdges = new THREE.LineSegments(new THREE.EdgesGeometry(wallNGeo), cadEdgeMat);
    wallNEdges.position.copy(wallN.position);
    trayGroup.add(wallNEdges);

    const wallS = new THREE.Mesh(wallNGeo, acrylicMat);
    wallS.position.set(0, wallH / 2, -5.35);
    trayGroup.add(wallS);
    const wallSEdges = new THREE.LineSegments(new THREE.EdgesGeometry(wallNGeo), cadEdgeMat);
    wallSEdges.position.copy(wallS.position);
    trayGroup.add(wallSEdges);

    const wallEGeo = new THREE.BoxGeometry(wallThick, wallH, 10.4);
    const wallE = new THREE.Mesh(wallEGeo, acrylicMat);
    wallE.position.set(5.35, wallH / 2, 0);
    trayGroup.add(wallE);
    const wallEEdges = new THREE.LineSegments(new THREE.EdgesGeometry(wallEGeo), cadEdgeMat);
    wallEEdges.position.copy(wallE.position);
    trayGroup.add(wallEEdges);

    const wallW = new THREE.Mesh(wallEGeo, acrylicMat);
    wallW.position.set(-5.35, wallH / 2, 0);
    trayGroup.add(wallW);
    const wallWEdges = new THREE.LineSegments(new THREE.EdgesGeometry(wallEGeo), cadEdgeMat);
    wallWEdges.position.copy(wallW.position);
    trayGroup.add(wallWEdges);

    /* =========================================================
       4. USER INTERACTIONS & CAMERA CONTROLS
       ========================================================= */
    function toggleTheme() {
      isDarkMode = !isDarkMode;
      document.body.classList.toggle('dark-mode', isDarkMode);
      const btn = document.getElementById('btn-theme');
      
      if (isDarkMode) {
        scene.background = DARK_BG;
        floorMat.opacity = 0.35;
        cadEdgeMat.color.setHex(0x94a3b8);
        stringMat.color.setHex(0xf1f5f9);
        btn.innerHTML = '☀️ 淺色模式';
      } else {
        scene.background = LIGHT_BG;
        floorMat.opacity = 0.18;
        cadEdgeMat.color.setHex(0x64748b);
        stringMat.color.setHex(0x334155);
        btn.innerHTML = '🌙 深色模式';
      }
    }

    function resetView() {
      animateCamera(DEFAULT_CAM_POS, DEFAULT_LOOK_AT);
      if (controls.autoRotate) toggleAutoRotate();
    }

    function toggleAutoRotate() {
      controls.autoRotate = !controls.autoRotate;
      const btn = document.getElementById('btn-rotate');
      if (controls.autoRotate) {
        btn.classList.add('active');
        btn.innerHTML = '⏸️ 停止旋轉';
      } else {
        btn.classList.remove('active');
        btn.innerHTML = '⏯️ 自動旋轉';
      }
    }

    function animateCamera(targetPos, targetLookAt) {
      const startPos = camera.position.clone();
      const startLook = controls.target.clone();
      let progress = 0;

      function step() {
        progress += 0.05;
        if (progress <= 1) {
          camera.position.lerpVectors(startPos, targetPos, easeInOutCubic(progress));
          controls.target.lerpVectors(startLook, targetLookAt, easeInOutCubic(progress));
          controls.update();
          requestAnimationFrame(step);
        } else {
          camera.position.copy(targetPos);
          controls.target.copy(targetLookAt);
          controls.update();
        }
      }
      step();
    }

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    /* =========================================================
       5. GLB EXPORT
       ========================================================= */
    function exportGLB() {
      if (typeof THREE.GLTFExporter === 'undefined') {
        alert('GLTFExporter 正在載入，請稍候重試！');
        return;
      }
      const exporter = new THREE.GLTFExporter();
      exporter.parse(
        apparatusRoot,
        function (gltf) {
          const blob = new Blob([gltf], { type: 'model/gltf-binary' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = `食鹽水表面張力實驗裝置.glb`;
          link.click();
          URL.revokeObjectURL(url);
        },
        { binary: true }
      );
    }

    /* =========================================================
       6. MAIN ANIMATION LOOP & RESIZE
       ========================================================= */
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
